name: Build SmartSteamEmu Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.resx'
      - '**.ico'
      - 'app.config'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build SSELauncher
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $packageUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net40/1.0.3/microsoft.netframework.referenceassemblies.net40.1.0.3.nupkg"
          $packageFile = Join-Path $env:RUNNER_TEMP "net40-reference-assemblies.nupkg"
          $packageDir = Join-Path $env:RUNNER_TEMP "net40-reference-assemblies"
          Invoke-WebRequest -Uri $packageUrl -OutFile $packageFile
          Expand-Archive -Path $packageFile -DestinationPath $packageDir -Force
          # TargetFrameworkRootPath must point to the directory containing .NETFramework.
          $frameworkRoot = Join-Path $packageDir "build"
          $referenceList = Join-Path $frameworkRoot ".NETFramework\v4.0\RedistList\FrameworkList.xml"
          if (-not (Test-Path $referenceList)) {
            Get-ChildItem -Path $packageDir -Recurse | Select-Object -First 30 -ExpandProperty FullName
            throw "Could not locate .NET Framework 4.0 reference assemblies."
          }
          "NET40_REFERENCE_ROOT=$frameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release
        shell: pwsh
        run: |
          msbuild .\SSELauncher.sln /m /verbosity:minimal /restore:false /p:Configuration=Release '/p:Platform=Any CPU' "/p:TargetFrameworkRootPath=$env:NET40_REFERENCE_ROOT\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "SSELauncher\bin\Release\SSELauncher.exe"
          if (-not (Test-Path $exe)) {
            $exe = "bin\Release\SSELauncher.exe"
          }
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Path . -Filter SSELauncher.exe -Recurse | Select-Object -ExpandProperty FullName
            throw "SSELauncher.exe was not found after the build."
          }
          Write-Host "Built: $((Resolve-Path $exe).Path)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSteamEmu-SSELauncher-windows
          path: |
            **/bin/Release/SSELauncher.exe
            **/bin/Release/SSELauncher.pdb
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
